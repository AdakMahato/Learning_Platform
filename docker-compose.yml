services:
  story-labs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engineering-story-labs
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - .env
    environment:
      - PLATFORM_AUTH_MODE=${PLATFORM_AUTH_MODE:-multiuser}
      - PLATFORM_DB_PATH=/app/data/platform.db
      - RUNNER_MAX_CONCURRENCY=${RUNNER_MAX_CONCURRENCY:-4}
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: "1.5"
