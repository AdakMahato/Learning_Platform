[theme]
base = "dark"
primaryColor = "#4F46E5"
backgroundColor = "#09090B"
secondaryBackgroundColor = "#111114"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
maxUploadSize = 5

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = "none"
